[project]
name = "spotify-mcp"
version = "0.1.0"
description = "MCP server to control Spotify from llm-workspace: desktop app control from WSL plus the Spotify Web API"
readme = "README.md"
authors = [{ name = "Konstantinos Kotsaras" }]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.3",
    "spotipy>=2.26.0",
]

[project.scripts]
spotify-mcp = "spotify_mcp.server:main"
spotify-mcp-login = "spotify_mcp.auth:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
